name: Oppdater møtekalender

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  oppdater:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer Playwright-nettleser
        run: npx playwright install --with-deps chromium

      - name: Hent møtedata
        run: node fetch.js
        timeout-minutes: 15

      - name: Kommiter og push oppdatert meetings.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meetings.json raw/
          git diff --staged --quiet || git commit -m "Oppdater møtedata $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
